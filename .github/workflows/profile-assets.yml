name: Refresh profile assets

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v6

      - name: Create profile directory
        run: mkdir -p profile

      - name: Generate dark statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &include_all_commits=true
            &show=prs_merged,reviews
            &theme=github_dark
            &hide_border=true
          path: profile/stats-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light statistics card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=${{ github.repository_owner }}
            &show_icons=true
            &include_all_commits=true
            &show=prs_merged,reviews
            &theme=default
            &hide_border=true
          path: profile/stats-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dark language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=8
            &exclude_repo=Young-Allen
            &theme=github_dark
            &hide_border=true
          path: profile/languages-dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate light language card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=${{ github.repository_owner }}
            &layout=compact
            &langs_count=8
            &exclude_repo=Young-Allen
            &theme=default
            &hide_border=true
          path: profile/languages-light.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            profile/github-snake.svg?color_snake=#2f81f7&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            profile/github-snake-dark.svg?palette=github-dark&color_snake=#58a6ff

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile assets"
          git push
