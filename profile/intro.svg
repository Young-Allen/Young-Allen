<svg
  width="900"
  height="250"
  viewBox="0 0 900 250"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Shadow Wang Intro Banner</title>

  <desc id="desc">
    Animated GitHub profile banner for Shadow Wang.
    Human–AI Interaction, AI Agents and Visual Computing.
  </desc>

  <defs>
    <!-- Name typing clip -->
    <clipPath id="nameClip">
      <rect
        x="36"
        y="25"
        width="0"
        height="55"
        rx="2"
      >
        <animate
          attributeName="width"
          values="0;0;470;470"
          keyTimes="0;0.08;0.34;1"
          dur="10s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <!-- Name gradient -->
    <linearGradient
      id="nameGradient"
      x1="36"
      y1="0"
      x2="500"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0%"
        stop-color="#6CB6FF"
      />
      <stop
        offset="100%"
        stop-color="#9CCBFF"
      />
    </linearGradient>

    <!-- Top accent line -->
    <linearGradient
      id="lineGradient"
      x1="36"
      y1="0"
      x2="864"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0%"
        stop-color="#6CB6FF"
        stop-opacity="0.90"
      />
      <stop
        offset="100%"
        stop-color="#6CB6FF"
        stop-opacity="0.08"
      />
    </linearGradient>
  </defs>

  <style>
    .name {
      font: 700 38px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      fill: url(#nameGradient);
      letter-spacing: 0.2px;
    }

    .subtitle {
      font: 600 20px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      letter-spacing: 0.15px;
    }

    /* refined harmonious palette */
    .hci {
      fill: #F28B82;
    }

    .agent {
      fill: #E6B450;
    }

    .visual {
      fill: #7CC7FF;
    }

    .separator {
      fill: #7D8590;
      font-weight: 400;
    }

    .description {
      font: 500 20px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      fill: #C9D1D9;
    }

    .keyword {
      fill: #8EC5FF;
      font-weight: 700;
    }

    .cursor {
      fill: #6CB6FF;
    }
  </style>

  <!-- Top line -->
  <rect
    x="36"
    y="18"
    width="828"
    height="2"
    rx="1"
    fill="url(#lineGradient)"
  >
    <animate
      attributeName="opacity"
      values="0.40;0.95;0.40"
      dur="5s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Line 1: typed name -->
  <g clip-path="url(#nameClip)">
    <text
      x="36"
      y="69"
      class="name"
    >
      Hi, I'm Shadow Wang
    </text>
  </g>

  <!-- Cursor -->
  <rect
    x="36"
    y="31"
    width="3"
    height="42"
    rx="1.5"
    class="cursor"
  >
    <animate
      attributeName="x"
      values="36;36;470;470"
      keyTimes="0;0.08;0.34;1"
      dur="10s"
      repeatCount="indefinite"
    />
    <animate
      attributeName="opacity"
      values="1;0;1;0;1"
      dur="0.9s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Line 2: research directions -->
  <g opacity="0">
    <text
      x="36"
      y="111"
      class="subtitle"
    >
      <tspan class="hci">Human–AI Interaction</tspan>
      <tspan class="separator"> · </tspan>
      <tspan class="agent">AI Agents</tspan>
      <tspan class="separator"> · </tspan>
      <tspan class="visual">Visual Computing</tspan>
    </text>

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.11;0.19;1"
      dur="10s"
      repeatCount="indefinite"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -1;0 0"
      dur="5s"
      repeatCount="indefinite"
      additive="sum"
    />
  </g>

  <!-- Line 3 -->
  <g opacity="0">
    <text
      x="36"
      y="164"
      class="description"
    >
      I explore how humans and intelligent systems
    </text>

    <animate
      attributeName="opacity"
      values="0;0;0;1;1"
      keyTimes="0;0.17;0.22;0.29;1"
      dur="10s"
      repeatCount="indefinite"
    />
  </g>

  <!-- Line 4 -->
  <g opacity="0">
    <text
      x="36"
      y="199"
      class="description"
    >
      <tspan>can </tspan>
      <tspan class="keyword">create</tspan>
      <tspan>, </tspan>
      <tspan class="keyword">communicate</tspan>
      <tspan> and </tspan>
      <tspan class="keyword">evolve</tspan>
      <tspan> together.</tspan>
    </text>

    <animate
      attributeName="opacity"
      values="0;0;0;0;1;1"
      keyTimes="0;0.23;0.28;0.33;0.39;1"
      dur="10s"
      repeatCount="indefinite"
    />
  </g>
</svg>
