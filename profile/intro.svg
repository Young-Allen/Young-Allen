<svg
  width="900"
  height="250"
  viewBox="0 0 900 250"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Shadow Wang Intro Banner</title>

  <desc id="desc">
    Animated GitHub profile banner for Shadow Wang.
    Human–AI Interaction, AI Agents and Visual Computing.
  </desc>

  <defs>
    <!-- 打字机裁剪区域 -->
    <clipPath id="nameClip">
      <rect x="36" y="25" width="0" height="55" rx="2">
        <animate
          attributeName="width"
          values="0;0;470;470"
          keyTimes="0;0.12;0.58;1"
          dur="6s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <!-- 姓名渐变 -->
    <linearGradient
      id="nameGradient"
      x1="36"
      y1="0"
      x2="480"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#79C0FF" />
    </linearGradient>

    <!-- 顶部分隔线渐变 -->
    <linearGradient
      id="lineGradient"
      x1="36"
      y1="0"
      x2="864"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0.10" />
    </linearGradient>
  </defs>

  <style>
    .name {
      font: 700 38px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      fill: url(#nameGradient);
      letter-spacing: 0.2px;
    }

    .subtitle {
      font: 600 20px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      letter-spacing: 0.15px;
    }

    .hci {
      fill: #58A6FF;
    }

    .agent {
      fill: #BC8CFF;
    }

    .visual {
      fill: #56D4DD;
    }

    .separator {
      fill: #6E7681;
      font-weight: 400;
    }

    .description {
      font: 500 20px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      fill: #C9D1D9;
    }

    .keyword {
      fill: #79C0FF;
      font-weight: 700;
    }

    .cursor {
      fill: #58A6FF;
    }
  </style>

  <!-- 顶部分隔线 -->
  <rect
    x="36"
    y="18"
    width="828"
    height="2"
    rx="1"
    fill="url(#lineGradient)"
  >
    <animate
      attributeName="opacity"
      values="0.45;1;0.45"
      dur="4s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- 第一行：姓名打字效果 -->
  <g clip-path="url(#nameClip)">
    <text x="36" y="69" class="name">
      Hi, I'm Shadow Wang
    </text>
  </g>

  <!-- 打字光标 -->
  <rect
    x="36"
    y="31"
    width="3"
    height="42"
    rx="1.5"
    class="cursor"
  >
    <animate
      attributeName="x"
      values="36;36;470;470"
      keyTimes="0;0.12;0.58;1"
      dur="6s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="1;0;1;0;1"
      dur="0.9s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- 第二行：研究方向 -->
  <g opacity="0">
    <text x="36" y="111" class="subtitle">
      <tspan class="hci">Human–AI Interaction</tspan>
      <tspan class="separator"> · </tspan>
      <tspan class="agent">AI Agents</tspan>
      <tspan class="separator"> · </tspan>
      <tspan class="visual">Visual Computing</tspan>
    </text>

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.16;0.28;1"
      dur="6s"
      repeatCount="indefinite"
    />

    <animateTransform
      attributeName="transform"
      type="translate"
      values="0 0;0 -1;0 0"
      dur="5s"
      repeatCount="indefinite"
      additive="sum"
    />
  </g>

  <!-- 第三行 -->
  <g opacity="0">
    <text x="36" y="164" class="description">
      I explore how humans and intelligent systems
    </text>

    <animate
      attributeName="opacity"
      values="0;0;0;1;1"
      keyTimes="0;0.24;0.34;0.44;1"
      dur="6s"
      repeatCount="indefinite"
    />
  </g>

  <!-- 第四行 -->
  <g opacity="0">
    <text x="36" y="199" class="description">
      <tspan>can </tspan>
      <tspan class="keyword">create</tspan>
      <tspan>, </tspan>
      <tspan class="keyword">communicate</tspan>
      <tspan> and </tspan>
      <tspan class="keyword">evolve</tspan>
      <tspan> together.</tspan>
    </text>

    <animate
      attributeName="opacity"
      values="0;0;0;0;1;1"
      keyTimes="0;0.30;0.38;0.48;0.58;1"
      dur="6s"
      repeatCount="indefinite"
    />
  </g>
</svg>
