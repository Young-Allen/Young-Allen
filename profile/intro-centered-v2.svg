<svg
  width="900"
  height="250"
  viewBox="0 0 900 250"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  preserveAspectRatio="xMidYMid meet"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Shadow Wang Intro Banner</title>

  <desc id="desc">
    Animated GitHub profile banner for Shadow Wang.
    Human–AI Interaction, AI Agents and Visual Computing.
  </desc>

  <defs>
    <!-- 姓名打字机裁剪区域 -->
    <clipPath id="nameClip">
      <rect
        x="255"
        y="25"
        width="0"
        height="56"
        rx="2"
      >
        <animate
          attributeName="width"
          values="0;0;390;390"
          keyTimes="0;0.08;0.34;1"
          dur="10s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <!-- 姓名渐变 -->
    <linearGradient
      id="nameGradient"
      x1="255"
      y1="0"
      x2="645"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0%"
        stop-color="#6EA8FE"
      />

      <stop
        offset="52%"
        stop-color="#86A8F7"
      />

      <stop
        offset="100%"
        stop-color="#A78BFA"
      />
    </linearGradient>

    <!-- 居中的顶部装饰线 -->
    <linearGradient
      id="lineGradient"
      x1="150"
      y1="0"
      x2="750"
      y2="0"
      gradientUnits="userSpaceOnUse"
    >
      <stop
        offset="0%"
        stop-color="#E28B82"
        stop-opacity="0.12"
      />

      <stop
        offset="28%"
        stop-color="#E28B82"
        stop-opacity="0.65"
      />

      <stop
        offset="50%"
        stop-color="#D7B05F"
        stop-opacity="0.72"
      />

      <stop
        offset="72%"
        stop-color="#65B8B4"
        stop-opacity="0.65"
      />

      <stop
        offset="100%"
        stop-color="#65B8B4"
        stop-opacity="0.12"
      />
    </linearGradient>
  </defs>

  <style>
    .name {
      font: 700 38px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      fill: url(#nameGradient);
      letter-spacing: 0.2px;
    }

    .subtitle {
      font: 600 20px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      letter-spacing: 0.2px;
    }

    /*
      三个方向采用统一明度、较低饱和度的配色：
      珊瑚色 / 琥珀色 / 青绿色
    */
    .hci {
      fill: #E28B82;
    }

    .agent {
      fill: #D7B05F;
    }

    .visual {
      fill: #65B8B4;
    }

    .separator {
      fill: #7D8590;
      font-weight: 400;
    }

    .description {
      font: 500 20px 'Segoe UI', Ubuntu, Arial, Sans-Serif;
      fill: #C9D1D9;
      letter-spacing: 0.05px;
    }

    .keyword {
      fill: #8EACF4;
      font-weight: 700;
    }

    .cursor {
      fill: #8EA8F8;
    }

    /*
      GitHub 浅色模式下提高文字对比度
    */
    @media (prefers-color-scheme: light) {
      .hci {
        fill: #B95F59;
      }

      .agent {
        fill: #98701E;
      }

      .visual {
        fill: #327F7C;
      }

      .separator {
        fill: #707781;
      }

      .description {
        fill: #4B5563;
      }

      .keyword {
        fill: #526FBE;
      }
    }
  </style>

  <!-- 顶部居中装饰线 -->
  <rect
    x="150"
    y="18"
    width="600"
    height="2"
    rx="1"
    fill="url(#lineGradient)"
  >
    <animate
      attributeName="opacity"
      values="0.55;1;0.55"
      dur="6s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- 第一行：居中的姓名打字效果 -->
  <g clip-path="url(#nameClip)">
    <text
      x="450"
      y="69"
      text-anchor="middle"
      textLength="390"
      lengthAdjust="spacingAndGlyphs"
      class="name"
    >
      Hi, I'm Shadow Wang
    </text>
  </g>

  <!-- 打字光标 -->
  <rect
    x="255"
    y="31"
    width="3"
    height="42"
    rx="1.5"
    class="cursor"
  >
    <animate
      attributeName="x"
      values="255;255;645;645"
      keyTimes="0;0.08;0.34;1"
      dur="10s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="1;0;1;0;1"
      dur="0.9s"
      repeatCount="indefinite"
    />
  </rect>

  <!-- 第二行：研究方向，只有淡入，不再浮动 -->
  <g opacity="0">
    <text
      x="450"
      y="115"
      text-anchor="middle"
      class="subtitle"
      xml:space="preserve"
    ><tspan class="hci">Human–AI Interaction</tspan><tspan class="separator">  ·  </tspan><tspan class="agent">AI Agents</tspan><tspan class="separator">  ·  </tspan><tspan class="visual">Visual Computing</tspan></text>

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.11;0.20;1"
      dur="10s"
      repeatCount="indefinite"
    />
  </g>

  <!-- 第三行 -->
  <g opacity="0">
    <text
      x="450"
      y="169"
      text-anchor="middle"
      class="description"
    >
      I explore how humans and intelligent systems
    </text>

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.20;0.30;1"
      dur="10s"
      repeatCount="indefinite"
    />
  </g>

  <!-- 第四行 -->
  <g opacity="0">
    <text
      x="450"
      y="204"
      text-anchor="middle"
      class="description"
      xml:space="preserve"
    ><tspan>can </tspan><tspan class="keyword">create</tspan><tspan>, </tspan><tspan class="keyword">communicate</tspan><tspan> and </tspan><tspan class="keyword">evolve</tspan><tspan> together.</tspan></text>

    <animate
      attributeName="opacity"
      values="0;0;1;1"
      keyTimes="0;0.29;0.40;1"
      dur="10s"
      repeatCount="indefinite"
    />
  </g>
</svg>
